<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.4" />
  
  <!-- School Building / Portico Icon -->
  <g transform="translate(106, 120)">
    <!-- Roof / Gable -->
    <polygon points="150,16 280,85 20,85" fill="url(#accent)" />
    <!-- Eagle / GES star -->
    <polygon points="150,38 155,52 170,52 158,61 162,75 150,66 138,75 142,61 130,52 145,52" fill="#fbbf24" />
    <!-- Architrave -->
    <rect x="25" y="85" width="250" height="16" rx="4" fill="#34d399" />
    <!-- Columns -->
    <rect x="42" y="101" width="24" height="110" rx="3" fill="#ecfdf5" opacity="0.9" />
    <rect x="108" y="101" width="24" height="110" rx="3" fill="#ecfdf5" opacity="0.9" />
    <rect x="168" y="101" width="24" height="110" rx="3" fill="#ecfdf5" opacity="0.9" />
    <rect x="234" y="101" width="24" height="110" rx="3" fill="#ecfdf5" opacity="0.9" />
    <!-- Base -->
    <rect x="15" y="211" width="270" height="18" rx="5" fill="#10b981" />
  </g>

  <!-- Circular Smart Clock & Location Badge in Foreground -->
  <g transform="translate(290, 270)">
    <circle cx="90" cy="90" r="80" fill="#090d16" stroke="url(#gold)" stroke-width="6" />
    <circle cx="90" cy="90" r="70" fill="#064e3b" opacity="0.4" />
    <!-- Clock Hands at 8:00 AM -->
    <circle cx="90" cy="90" r="6" fill="#fbbf24" />
    <line x1="90" y1="90" x2="90" y2="40" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
    <line x1="90" y1="90" x2="124" y2="90" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <!-- GPS Location Pulse Indicator -->
    <circle cx="90" cy="90" r="22" fill="none" stroke="#34d399" stroke-width="3" opacity="0.8" />
  </g>

  <text x="256" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#ecfdf5" text-anchor="middle" letter-spacing="3">SIR EUGENE TECH</text>
</svg>
